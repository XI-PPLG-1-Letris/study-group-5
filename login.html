<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style-login.css">
</head>
<body>
    <main class="container">
    <a href="https://liputan6.com" class="back-link" aria-label="Kembali ke liputan6.com">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6"/></svg>
        Kembali ke liputan6.com
    </a>

    <section class="logo-section">
        <img src="asset/download__2_-removebg-preview.png" 
            alt="Logo Liputan6" class="logo-image" />
        <p class="logo-desc">Youniverse ID untuk seluruh layanan<br/>Kapanlagi Youniverse</p>
    </section>

    <div class="partner-icons">
        <img src="img1.png" alt="Partner 1" onerror="this.style.display='none'" />
        <img src="img2.png" alt="Partner 2" onerror="this.style.display='none'" />
        <img src="img3.png" alt="Partner 3" onerror="this.style.display='none'" />
    </div>

    <p class="login-with-text">Masuk dengan</p>

    <button class="btn-auth button-apple" type="button" aria-label="Continue with Apple">
        <svg viewBox="0 0 24 24"><path d="..." /></svg>
        Continue with Apple
    </button>

    <button class="btn-auth button-google" type="button" aria-label="Login with Google">
        <svg viewBox="0 0 46 46"><path d="..." /></svg>
        Login with Google
    </button>

    <div class="separator-container" aria-hidden="true">
        <div class="separator-line"></div>
        <div class="separator-text">Atau</div>
        <div class="separator-line"></div>
    </div>

    <form aria-label="Form login" novalidate>
        <input type="email" name="email" placeholder="Email" autocomplete="email" required aria-required="true" />
        <input type="password" name="password" placeholder="Password" autocomplete="current-password" required aria-required="true" />
    
        <div class="checkbox-container">
        <label class="checkbox-label">
            <input type="checkbox" name="ingatSaya" /> Ingatkan Saya
        </label>
        <a href="#" class="forgot-password">Lupa Kata Sandi</a>
            </div>

        <button type="submit" class="btn-submit">Masuk</button>
    </form>

    <p class="register-text">Belum Punya Akun? <a href="#">Daftar</a></p>
    <p class="privacy-text">Kebijakan Data Privacy Pengguna</p>
    </main>

    <footer class="footer" role="contentinfo">
    <div class="contact">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 8v10a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3V8M3 8l9 6 9-6M12 14V3"/>
        </svg>
        Contact Us :
    </div>
    <div>© All rights reserved. Kapanlagi Youniverse</div>
    </footer>
</body>
</html>
